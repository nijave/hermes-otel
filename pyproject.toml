[project]
name = "hermes-otel"
version = "0.1.0"
description = "OpenTelemetry OTLP tracing plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["hermes", "opentelemetry", "otel", "tracing", "genai", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "opentelemetry-sdk>=1.39.1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39.1,<2",
]

# Entry-point install is forward-looking until a real module ships; directory-drop
# / `hermes plugins install nijave/hermes-otel` are the supported paths today.
# [project.entry-points."hermes_agent.plugins"]
# hermes-otel = "hermes_otel_entry"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
