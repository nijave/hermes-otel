services:
  otelcol:
    build:
      context: ./e2e
      dockerfile: Dockerfile.collector
    volumes:
      - ./e2e/collector.yaml:/etc/collector.yaml:ro
      - ./out:/out

  e2e:
    build: ./e2e
    depends_on:
      - otelcol
    environment:
      OTEL_ENDPOINT: http://otelcol:4318/v1/traces
      PYTHONPATH: /hermes:/plugin
    volumes:
      - .:/plugin:ro
      # Override with HERMES_AGENT_DIR if the sibling checkout lives elsewhere.
      - ${HERMES_AGENT_DIR:-../hermes-agent}:/hermes:ro
      - ./out:/out
    command: ["python", "/plugin/e2e/run_e2e.py"]
